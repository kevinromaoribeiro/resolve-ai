# RESOLVE AI — infraestrutura enxuta
# Mensageria: Cloud API oficial da Meta (canal.py decide) com WasenderAPI de reserva.
# Comando:  docker compose up -d --build
#
# ATENCAO: variavel que nao aparece aqui com ${PLACEHOLDER} NAO chega no
# container, mesmo estando salva no Ambiente do EasyPanel. Ja queimamos horas
# com isso (WASENDER_API_KEY chegava vazia e o bot rodava sem autenticacao).
# Ao criar env nova: declare AQUI e salve no EasyPanel.
#
# SEM container_name de proposito: o Traefik do EasyPanel procura o servico
# pelo nome que ele mesmo gera (resolveai_bot). Fixar o nome aqui como
# "resolveai-bot" fazia o dominio HTTPS devolver 502 — o proxy batia num
# nome que nao existia. Custou o webhook da Meta nao subir.
services:
  bot:
    build: .
    restart: unless-stopped
    # `expose`, NAO `ports` — e a diferenca importa.
    #
    # Com `ports: 8000:8000` o bot ficava alcancavel direto em
    # http://IP:8000, por fora do proxy e SEM HTTPS. Conferido em 05/09:
    # respondia 200 da internet aberta. Isso quer dizer que o painel podia
    # ser aberto por um endereco onde o cookie com o token viaja em texto
    # puro, e que tudo o que o proxy acrescenta era contornavel por quem
    # soubesse o IP.
    #
    # `expose` mantem a porta visivel DENTRO da rede do Docker — que e por
    # onde o Traefik do EasyPanel alcanca o servico (ele procura pelo nome
    # que ele mesmo gera, ver o comentario no topo do arquivo) — e fecha
    # ela pra internet.
    #
    # SE O DOMINIO HTTPS CAIR depois de um deploy com isto, e aqui que se
    # olha primeiro: voltar pra `ports` restaura o acesso na hora.
    expose:
      - "8000"
    environment:
      # --- Canal: meta | wasender | auto (auto usa a Meta se houver token) ---
      - CANAL=${CANAL:-auto}
      # --- Cloud API oficial da Meta ---
      - META_TOKEN=${META_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_WABA_ID=${META_WABA_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_API_VERSION=${META_API_VERSION:-v23.0}
      # --- WasenderAPI (reserva) ---
      - WASENDER_API_KEY=${WASENDER_API_KEY}
      - WASENDER_URL=${WASENDER_URL:-https://www.wasenderapi.com}
      # --- App ---
      - ADMIN_PHONE=${ADMIN_PHONE}
      - MASTER_PHONE=${MASTER_PHONE}
      - TRIAL_DAYS=${TRIAL_DAYS:-14}
      - AUDIO_MAX_SECONDS=${AUDIO_MAX_SECONDS:-120}
      - TERMS_URL=${TERMS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PAYMENT_LINK=${PAYMENT_LINK}
      - PAYMENT_LINK_ANUAL=${PAYMENT_LINK_ANUAL}
      # --- Freios anti-bloqueio ---
      - DISPATCH_MAX_PER_CYCLE=${DISPATCH_MAX_PER_CYCLE:-5}
      - ENVIO_INTERVALO_MIN=${ENVIO_INTERVALO_MIN:-8}
      - ENVIO_INTERVALO_MAX=${ENVIO_INTERVALO_MAX:-15}
      - MAX_PROATIVAS_POR_USUARIO_DIA=${MAX_PROATIVAS_POR_USUARIO_DIA:-6}
      # --- Painel (fail-closed: sem token, painel fechado) ---
      - PAINEL_TOKEN=${PAINEL_TOKEN}
      - DASH_URL_BASE=${DASH_URL_BASE}
      - CUSTO_CLAUDE_MES=${CUSTO_CLAUDE_MES:-100}
      - DB_PATH=/app/data/resolve_ai.db
    volumes:
      - ./data:/app/data
    command: uvicorn wa_bot:app --host 0.0.0.0 --port 8000
