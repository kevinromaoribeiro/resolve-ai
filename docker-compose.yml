# RESOLVE AI — infraestrutura enxuta (WasenderAPI)
# Agora a mensageria é a WasenderAPI (nuvem), então NÃO subimos mais Evolution
# nem Postgres localmente. Só o bot FastAPI. Libera RAM na VPS.
# Comando:  docker compose up -d --build
#
# ATENÇÃO: variável que não aparece aqui com ${PLACEHOLDER} NÃO chega no
# container, mesmo estando salva no Ambiente do EasyPanel. Já queimamos horas
# com isso (WASENDER_API_KEY chegava vazia e o bot rodava sem autenticação).
# Ao criar env nova: declare AQUI e salve no EasyPanel.
services:
  bot:
    build: .
    container_name: resolveai-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # --- WasenderAPI (mensageria) ---
      - WASENDER_API_KEY=${WASENDER_API_KEY}
      - WASENDER_URL=${WASENDER_URL:-https://www.wasenderapi.com}
      # --- App ---
      - ADMIN_PHONE=${ADMIN_PHONE}
      - MASTER_PHONE=${MASTER_PHONE}
      - TRIAL_DAYS=${TRIAL_DAYS:-7}
      - AUDIO_MAX_SECONDS=${AUDIO_MAX_SECONDS:-120}
      - TERMS_URL=${TERMS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PAYMENT_LINK=${PAYMENT_LINK}
      - PAYMENT_LINK_ANUAL=${PAYMENT_LINK_ANUAL}
      # --- Painel (fail-closed: sem token, painel fechado) ---
      - PAINEL_TOKEN=${PAINEL_TOKEN}
      - DB_PATH=/app/data/resolve_ai.db
    volumes:
      - ./data:/app/data
    command: uvicorn wa_bot:app --host 0.0.0.0 --port 8000
